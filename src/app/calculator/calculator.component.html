<div class="calculator">
  <div class="display">
    <div class="expression">{{ expression || '&nbsp;' }}</div>
    <div class="value" [style.font-size]="displayFontSize">{{ displayValue }}</div>
  </div>

  <div class="buttons">
    <ng-container *ngFor="let row of buttons">
      <div class="button-row">
        <ng-container *ngFor="let btn of row">
          <button
            class="btn"
            [ngClass]="{
              'btn--func': btn === 'C' || btn === '±' || btn === '%',
              'btn--operator': isOperator(btn),
              'btn--equals': btn === '=',
              'btn--zero': btn === '0',
              'btn--active-op': btn === operatorSymbol || (btn === '/' && operatorValue === '/') || (btn === '*' && operatorValue === '*') || (btn === '-' && operatorValue === '-') || (btn === '+' && operatorValue === '+')
            }"
            (click)="handleClick(btn)"
          >
            {{ btn === '/' ? '÷' : btn === '*' ? '×' : btn === '-' ? '−' : btn }}
          </button>
        </ng-container>
      </div>
    </ng-container>
  </div>
</div>
